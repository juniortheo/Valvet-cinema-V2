# Velvet Cinema — Netlify configuration
# Static site: nothing to build, publish the repo root as-is.

[build]
  publish = "."

# ---------------------------------------------------------------
# Clean URLs
# ---------------------------------------------------------------
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
[[redirects]]
  from = "/events"
  to = "/events.html"
  status = 200
[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 200
[[redirects]]
  from = "/sponsor"
  to = "/sponsor.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# Every past event gets its own address, e.g. /events/black-swan
[[redirects]]
  from = "/events/:slug"
  to = "/event.html?slug=:slug"
  status = 200

# Site manager
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# ---------------------------------------------------------------
# Caching
# ---------------------------------------------------------------
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Content must never be cached, or edits would not show up
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Keep the site manager out of search results
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
