<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velvet Cinema | An independent pop-up cinema in Kigali</title>
<meta name="description" content="Velvet Cinema is a pop-up cinema in Kigali: carefully selected films, music, food and drinks, and themed décor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
</head>
<body data-page="home">

<div id="site-header"></div>

<main>

<section class="upcoming hidden" id="upcoming">
  <div class="wrap">
    <h2>Coming up</h2>
    <div id="eventList"></div>
  </div>
</section>

<section class="mission band">
  <div class="wrap">
    <h2 id="home-heading"></h2>
    <div id="home-body"></div>
    <p><a class="btn" href="/about">Our story</a></p>
  </div>
</section>

<section id="last-event">
  <div class="wrap last" id="eventBlock">
    <div class="img r43" role="img" aria-label="Photograph from our last event">Photographs from this night are coming soon</div>
    <div>
      <p class="kicker"></p>
      <h2></h2>
      <h3 class="ttl" style="font-size:2rem;margin-bottom:.75rem"></h3>
      <p class="body"></p>
      <a class="btn" href="/events">See the night and more photos</a>
    </div>
  </div>
</section>

<section class="band">
  <div class="wrap two">
    <div>
      <h2>Gallery</h2>
      <p>Photos from our screenings.</p>
      <div class="gimg" id="galleryTeaser" role="img" aria-label="Photograph from our gallery">Photo from our gallery</div>
      <a class="btn" href="/gallery">See the gallery</a>
    </div>
    <div>
      <h2>Keep the projector running</h2>
      <p>Sponsor Velvet Cinema for our next event or for our long term vision.</p>
      <a class="btn burg" href="/sponsor">Sponsor us</a>
    </div>
  </div>
</section>

<section id="movies">
  <div class="wrap">
    <h2>Movies shown</h2>
    <div class="movies" id="moviesList"></div>
  </div>
</section>
</main>

<div id="site-footer"></div>
<script src="/js/site.js"></script>
</body>
</html>
