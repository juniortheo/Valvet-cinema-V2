<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery | Velvet Cinema</title>
<meta name="description" content="A look back at past Velvet Cinema screenings and events in Kigali.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
</head>
<body data-page="gallery">

<div id="site-header"></div>

<main>

<div class="masthead" id="galleryHead">
  <div class="wrap">
    <h1>A look back at our past events.</h1>
    <p>Photographs from previous screenings and events.</p>
  </div>
</div>

<section>
  <div class="wrap">
    <div class="grid-gal" id="galleryGrid"></div>
  </div>
</section>

<section class="band">
  <div class="wrap two">
    <div>
      <h2>A look back</h2>
      <p>Photographs from every night we have put on.</p>
      <a class="btn" href="/gallery">See the gallery</a>
    </div>
    <div>
      <h2>Keep the projector running</h2>
      <p>Sponsor Velvet Cinema for our next event or for our long term vision.</p>
      <a class="btn burg" href="/sponsor">Sponsor us</a>
    </div>
  </div>
</section>

<div class="lb" aria-hidden="true">
  <button class="x" aria-label="Close">&times;</button>
  <button class="p" aria-label="Previous">&lsaquo;</button>
  <button class="n" aria-label="Next">&rsaquo;</button>
  <img src="" alt="">
</div>
</main>

<div id="site-footer"></div>
<script src="/js/site.js"></script>
</body>
</html>
